[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kira-engine"
version = "0.1.0"
description = "Kira spine: local provider-routing agent engine (sub-project 1 of 8)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "keyring>=25",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "anyio>=4"]
# Local listening. The engine runs without it and says so: /v1/kira/voice reports
# stt.available=false with the install line in `detail`. Deliberately not a hard
# dependency — a 100 MB model download must never be a requirement to serve chat.
# `av` is pinned below 19: faster-whisper 1.2.1 calls `av.open(..., metadata_errors=...)`,
# which av 19 removed, and the failure only appears when a real WAV is transcribed.
voice = ["faster-whisper>=1.1", "av>=11,<19"]
# The native window. Same rule as `voice`: `kira-engine serve` and the browser UI never need it,
# and `kira-engine desktop` names this line when the import is missing.
desktop = ["pywebview>=6", "pystray>=0.19", "pillow>=10"]
# Only `packaging/build.ps1` needs this: the frozen Kira.exe is an artifact, not an install line.
build = ["pyinstaller>=6"]

[project.scripts]
kira-engine = "kira.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
