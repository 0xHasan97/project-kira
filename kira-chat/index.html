<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what lets the phone layout reach into the notch; without it the
         safe-area insets every rule reads are always zero. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f1113" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Kira" />
    <title>Kira</title>
    <!-- Resolve the mode before the first paint, so a light desktop never flashes the dark canvas
         while the bundle is still parsing. `useAppearance` takes over as soon as React mounts. -->
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("kira.appearance");
          const dark = matchMedia("(prefers-color-scheme: dark)").matches;
          const mode =
            stored === "light" || stored === "dark"
              ? stored
              : dark
                ? "dark"
                : "light";
          document.documentElement.dataset.mode = mode;
          document.documentElement.style.colorScheme = mode;
          const theme = document.querySelector('meta[name="theme-color"]');
          if (theme) theme.content = mode === "light" ? "#f5f5f7" : "#0f1113";
          const status = document.querySelector(
            'meta[name="apple-mobile-web-app-status-bar-style"]',
          );
          if (status)
            status.content = mode === "light" ? "default" : "black-translucent";
        } catch {}
      })();
    </script>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f1113'/%3E%3Ccircle cx='16' cy='16' r='6.5' fill='%237fd1ae'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%237fd1ae' stroke-opacity='.35' stroke-width='1.5'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
